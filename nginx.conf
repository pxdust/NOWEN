server {
    listen 39000 default_server;
    listen [::]:39000 default_server;
    server_name _;

    # 允许较大的请求体（图标/壁纸上传）
    client_max_body_size 10m;

    # 静态资源在构建时预压缩。运行时只压缩很小的 API JSON，避免路由 CPU 每次现压 1MB 级 JS。
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml application/xml;

    # Vite 带 hash 的资源可以长期缓存
    location /assets/ {
        root /app/dist;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 1. 托管前端静态文件
    location / {
        root /app/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # 2. 转发 API 请求给后端 (localhost:39001)
    location /api/ {
        proxy_pass http://127.0.0.1:39001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
